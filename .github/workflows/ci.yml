      #     uses: actions/checkout@v4
      #     with:
      #       repository: GRADweight/shared-lib
      #       ref: f05457b4
      #       path: _shared-lib
      #       token: ${{ secrets.SHARED_LIB_TOKEN }}
      #   - name: Checkout autonomy/gw_core (privat, CANONICAL via Secret)
      #     uses: actions/checkout@v4
      #     with:
      #       repository: GRADweight/autonomy
      #       path: _autonomy
      #       token: ${{ secrets.GW_CORE_TOKEN }}
