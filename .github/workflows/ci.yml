name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Installieren
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-14
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installieren
        run: python -m pip install -e ".[dev]"
      - name: Sandbox-Fähigkeiten dieser Plattform (als Hinweis-Annotation)
        run: >-
          python -c "import json, gradweight_orchestration as g;
          print('::notice title=Sandbox-Fähigkeiten ${{ matrix.os }}::'
          + json.dumps(g.detect_capabilities().as_dict(), ensure_ascii=False))"
      - name: pytest mit Abdeckung (Schwelle in pyproject.toml)
        run: python -m pytest --cov --cov-report=term-missing --junitxml=pytest-junit.xml
      - name: Fehlschläge als Annotationen
        if: failure()
        run: python .github/scripts/junit_annotations.py pytest-junit.xml

  sandbox-linux:
    name: Sandbox-Nachweise Linux (Namespaces, root)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Installieren
        run: python -m pip install -e ".[dev]"
      # Ubuntu 24.04 sperrt unprivilegierte User-Namespaces per AppArmor. Für den
      # Nachweis der Netzwerk-/PID-Isolation wird die Sperre nur in diesem Job gelöst.
      - name: Unprivilegierte User-Namespaces erlauben (nur Testumgebung)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sandbox-Tests als normaler Benutzer (mit Namespaces)
        run: python -m pytest tests/test_sandbox.py tests/test_execution.py -ra --junitxml=sandbox-user.xml
      # Für den run_as_user-Test muss "nobody" Paket und Tests lesen können; das
      # Home-Verzeichnis des Runners ist sonst nicht durchsuchbar.
      - name: Arbeitsverzeichnis für nobody erreichbar machen (nur Testumgebung)
        run: |
          chmod -R o+rX "$GITHUB_WORKSPACE"
          p="$GITHUB_WORKSPACE"
          while [ "$p" != "/" ]; do sudo chmod o+x "$p"; p=$(dirname "$p"); done
      - name: Sandbox-Tests als root (run_as_user, Namespaces ohne User-Namespace)
        run: sudo "$(command -v python)" -m pytest tests/test_sandbox.py -ra -p no:cacheprovider --junitxml=sandbox-root.xml
      - name: Fehlschläge als Annotationen
        if: failure()
        run: |
          for f in sandbox-user.xml sandbox-root.xml; do
            [ -f "$f" ] && python .github/scripts/junit_annotations.py "$f" || true
          done

  package:
    name: Paket (Wheel bauen, frisch installieren, Smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Bauen
        run: |
          python -m pip install build
          python -m build
      - name: Wheel enthält py.typed
        run: python -m zipfile -l dist/*.whl | grep -q "gradweight_orchestration/py.typed"
      - name: In frischem venv installieren
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Import-Smoke (ausserhalb des Quellbaums)
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import gradweight_orchestration as g; print(g.__version__)"
      - name: CLI-Smoke
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/gw-orchestration" --version
          "$RUNNER_TEMP/venv/bin/gw-orchestration" sandbox-info
      - name: Demo aus dem installierten Wheel (offline, Skript-Modell) und Audit-Prüfung
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/gw-orchestration" demo --ausgabe "$RUNNER_TEMP/demo"
          "$RUNNER_TEMP/venv/bin/gw-orchestration" audit-verify "$RUNNER_TEMP/demo/audit.jsonl"

  security:
    name: Sicherheit (gitleaks, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: gitleaks installieren (Binary mit Prüfsumme)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks (Git-Historie)
        run: gitleaks git . --redact --verbose
      - name: gitleaks (Arbeitsverzeichnis)
        run: gitleaks dir . --redact --verbose
      - name: pip-audit (Paket mit allen Extras)
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install ".[httpx,otel]"
          SITE=$("$RUNNER_TEMP/audit/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          uvx pip-audit --progress-spinner off --path "$SITE"
