[project]
name = "gw-orchestration"
version = "0.1.0"
description = "GRADweight Multi-Agent-Orchestrator (M4-M7): Planner->Router->Executor->Observer + Memory + Human-in-the-Loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - GRADweight GmbH" }
authors = [{ name = "GRADweight GmbH", email = "edin@gradweight.ch" }]
keywords = ["agent", "orchestrator", "human-in-the-loop", "guardrails", "kmu"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orch"]

[tool.pytest.ini_options]
pythonpath = ["vendor", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
